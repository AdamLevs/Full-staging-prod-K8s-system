# Default values for PostgreSQL
replicaCount: 1

image:
  repository: postgres
  pullPolicy: IfNotPresent
  tag: "15"

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 5432

persistence:
  enabled: true
  size: 10Gi
  storageClassName: "standard"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

nodeSelector:
  env: staging

tolerations: []

affinity: {}

postgresql:
  database: appdb
  username: appuser
  password: apppass

