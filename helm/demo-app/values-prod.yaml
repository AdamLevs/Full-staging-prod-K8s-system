# Production values for demo-app
replicaCount: 2

image:
  repository: demo-app
  pullPolicy: IfNotPresent
  tag: "latest"

nodeSelector:
  env: prod

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 256Mi

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: prod.local.app
      paths:
        - path: /
          pathType: Prefix

env:
  DATABASE_URL: "postgresql://appuser:apppass@postgres-service.prod.svc.cluster.local:5432/appdb"
  REDIS_HOST: "redis-service.prod.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ""

