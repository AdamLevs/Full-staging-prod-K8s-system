# Staging values for demo-app
replicaCount: 1

image:
  repository: demo-app
  pullPolicy: IfNotPresent
  tag: "latest"

nodeSelector:
  env: staging

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: staging.local.app
      paths:
        - path: /
          pathType: Prefix

env:
  DATABASE_URL: "postgresql://appuser:apppass@postgres-service.staging.svc.cluster.local:5432/appdb"
  REDIS_HOST: "redis-service.staging.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ""

